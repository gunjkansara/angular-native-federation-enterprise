<div class="access-denied">

    <mat-icon class="access-icon">
        lock
    </mat-icon>

    <h1>
        Access Denied
    </h1>

    <p>
        You do not have permission to access this page.
    </p>

    <button mat-raised-button color="warn" (click)="logoutAndRedirect()">

        <mat-icon>
            logout
        </mat-icon>

        Logout & Return to Login

    </button>

</div>
